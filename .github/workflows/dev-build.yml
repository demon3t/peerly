# Every pull request gets a "Peerly Dev" build to try before merging: red icon, installs next to the
# release with its own profile (scripts/dev-flavor.mjs). It is published as the pre-release
# "dev-pr-<number>" (pre-releases are never "latest", so the updater ignores them), linked from a
# comment on the pull request, and deleted when the pull request is closed.
name: Dev build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TAG: dev-pr-${{ github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  windows:
    # Forks get a read-only token and can't publish releases.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make it a dev build
        run: node scripts/dev-flavor.mjs ${{ github.run_number }}

      - name: Build UI
        run: npm run build

      - name: Package installer
        run: node scripts/package-all.mjs win x64

      - name: Publish pre-release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          pr="${{ github.event.pull_request.number }}"
          sha="${{ github.event.pull_request.head.sha }}"
          cat > notes.md <<EOF
          Dev build of #$pr (${sha:0:7}) — **Peerly Dev $version**.

          Installs next to the regular Peerly with its own settings and torrent list, and has a red icon.
          Not signed: Windows SmartScreen may ask to confirm ("More info" → "Run anyway").
          EOF
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/upload/Peerly-Dev-Windows-x64-Setup.exe \
            --target "$sha" --prerelease --latest=false \
            --title "Peerly Dev — PR #$pr" --notes-file notes.md

      - name: Link it from the pull request
        shell: bash
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/Peerly-Dev-Windows-x64-Setup.exe"
          body="**Dev build** for ${{ github.event.pull_request.head.sha }}: [Peerly-Dev-Windows-x64-Setup.exe]($url) · [release page](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "$body" \
            || gh pr comment ${{ github.event.pull_request.number }} --body "$body"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the dev build
        run: gh release delete "$TAG" --yes --cleanup-tag || true

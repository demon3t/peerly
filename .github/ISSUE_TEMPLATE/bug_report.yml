# Opened from Peerly: Settings → About → "Report a problem" pre-fills the "version" field.
name: Report a problem
description: Something in Peerly doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a magnet link…
        2. …
  - type: input
    id: version
    attributes:
      label: Peerly version and system
      placeholder: Peerly 0.3.0 · Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Build details
      description: Settings → About → "Copy details", if you can.
      render: text

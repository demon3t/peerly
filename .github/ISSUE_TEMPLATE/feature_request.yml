# Opened from Peerly: Settings → About → "Suggest a feature" pre-fills the "version" field.
name: Suggest a feature
description: Tell us what Peerly is missing.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Peerly to do?
      placeholder: e.g. Show the remaining time for every torrent in the list.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What problem would it solve?
      description: How do you work around it today, if at all?
  - type: input
    id: version
    attributes:
      label: Peerly version and system
      placeholder: Peerly 0.3.0 · Windows 11 x64
